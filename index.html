      .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))),
  comprobante: (numero) => esperar(datos.comprobantes.find((c) => c.numero === numero) ?? null),

   * Las cifras del tablero.

   * comprobantes—, del que la lista solo enseña los últimos. Lo que usted emita
   * se suma encima, para que el tablero reaccione a lo que hace en lugar de
   * quedarse en una foto.

  resumen: () => {
    const base = SEMILLA.resumen;
    const nuevos = datos.comprobantes.filter((c) => !c.semilla);
    const cuenta = (estado) => nuevos.filter((c) => c.estado === estado).length;
    // Las bases se suman por separado y de ellas sale todo lo demás. Si el
    // titular dijera una cosa y el pie otra —ventas del mes que no salen de la
    // suma de sus bases— el tablero se contradiría a sí mismo, y a partir de
    // ahí ninguna cifra merece crédito.

    const base15 = base.base15 + emitidos.reduce((a, c) => a + c.totales.base15, 0);
    const base0 = base.base0 + emitidos.reduce((a, c) => a + c.totales.base0, 0);
    const centavos = (n) => Math.round(n * 100);

    return esperar({
      ...base,
      autorizados: base.autorizados + cuenta('AUTORIZADO'),
      pendientes: base.pendientes + cuenta('ENVIADO') + cuenta('RECIBIDO'),
      devueltos: base.devueltos + cuenta('DEVUELTO'),
      borradores: cuenta('BORRADOR'),

const nuevoId = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

 * El siguiente número libre de un punto de emisión.
 *
 * No basta con sumar uno al contador del punto: el contador dice cuál fue el
 * último EMITIDO, y puede haber borradores con número reservado por encima. Si
 * solo se mirara el contador, la siguiente factura nacería con un número que ya
 * estaba usado — que es justo lo que pasaba con la 001-001-000000149 de los
 * datos de ejemplo, donde el contador decía 148 y el borrador ya era el 149.
 *

 * datos con su restricción de unicidad.

function siguienteSecuencial(punto) {
  const usados = datos.comprobantes
    .filter((c) => c.numero?.startsWith(punto.codigo + '-'))
    .map((c) => Number(c.numero.split('-')[2]))
    .filter(Number.isFinite);

const guardar = {
  /** Crea o actualiza un cliente. Devuelve el cliente tal como quedó. */
  cliente(entrada) {
    const { identificacion, razonSocial } = comprobarCliente(entrada);
    const existente = datos.clientes.find((c) => c.id === entrada.id);

    const cliente = {
      ...(existente ?? {}),
      id: existente?.id ?? nuevoId(),
      tipo: entrada.tipo,
      identificacion,
      razonSocial,
      ciudad: String(entrada.ciudad ?? '').trim(),
      correo: String(entrada.correo ?? '').trim(),
      telefono: String(entrada.telefono ?? '').trim(),
      direccion: String(entrada.direccion ?? '').trim(),
      activo: true,
      comprobantes: existente?.comprobantes ?? 0,
      facturado: existente?.facturado ?? 0,
    };

    if (existente) datos.clientes[datos.clientes.indexOf(existente)] = cliente;
    else datos.clientes.unshift(cliente);

    persistir();
    return esperar(cliente);
  },

  /** Crea o actualiza un producto. `codigoOriginal` identifica al que se edita. */
  producto(entrada) {
    const { codigo, descripcion } = comprobarProducto(entrada);
    const existente = datos.productos.find((p) => p.codigo === entrada.codigoOriginal);

    const producto = {
      ...(existente ?? {}),
      codigo,
      descripcion,
      unidad: String(entrada.unidad ?? '').trim() || 'UNIDAD',
      tipo: entrada.tipo === 'Servicio' ? 'Servicio' : 'Bien',
      precio: Number(entrada.precio),
      iva: Number(entrada.iva),
      activo: true,
    };

    if (existente) datos.productos[datos.productos.indexOf(existente)] = producto;
    else datos.productos.unshift(producto);

    persistir();
    return esperar(producto);
  },

  /**
   * Guarda una factura como borrador y le asigna su número.
   *
   * El número se reserva aquí, al crearla, y no al emitirla. Podría parecer que
   * es mejor esperar —así no se gastan números en borradores que se tiran—,
   * pero dos cajas facturando a la vez pedirían el mismo número. Se entrega de
   * uno en uno y no se reutiliza: un hueco en la numeración se explica, un
   * número repetido lo rechaza el SRI.
   */
  borrador(entrada) {
    const cliente = datos.clientes.find((c) => c.id === entrada.clienteId);
    if (!cliente) fallo('Hay que elegir a quién se le factura.');
    if (!entrada.lineas?.length) fallo('Una factura sin líneas no se puede emitir.');

    const punto = datos.puntos.find((p) => p.codigo === entrada.punto && p.activo)
      ?? datos.puntos.find((p) => p.activo);
    if (!punto) fallo('No hay ningún punto de emisión activo.');

    const secuencial = siguienteSecuencial(punto);
    punto.ultimo = secuencial;
    const numeroNuevo = `${punto.codigo}-${String(secuencial).padStart(9, '0')}`;

    // Cinturón y tirantes. La base de datos tiene una restricción de unicidad
    // sobre (punto, tipo, secuencial) que rechazaría esto, y el SRI rechaza dos
    // comprobantes con el mismo número. Vale más fallar aquí, con un mensaje
    // que se entiende, que descubrirlo cuando el documento ya salió.
    if (datos.comprobantes.some((c) => c.numero === numeroNuevo)) {
      fallo(`Ya existe un comprobante ${numeroNuevo}. La numeración de un punto de ` +
            'emisión no puede repetirse: el SRI lo rechaza.');
    }

    const comprobante = {
      id: nuevoId(),
      numero: numeroNuevo,
      tipo: 'Factura',
      estado: 'BORRADOR',
      cliente,
      fecha: new Date(),
      fechaAutorizacion: null,
      // La clave de acceso se asigna al firmar, porque va dentro de lo firmado.
      // Un borrador todavía no tiene ninguna, y fabricar una aquí sería
      // enseñar un número que después no coincidiría con el de verdad.
      claveAcceso: null,
      autorizacion: null,
      formaPago: entrada.formaPago,
      lineas: entrada.lineas.map((l) => ({ ...l })),
      totales: totalizar(entrada.lineas),
      simulado: false,
    };

    datos.comprobantes.unshift(comprobante);
    persistir();
    return esperar(comprobante);
  },

  /**
   * La emisión simulada.
   *
   * Recorre los estados igual que el sistema de verdad, pero **sin firmar y sin
   * hablar con el SRI**, porque ni el certificado ni la conexión están
   * enchufados todavía. Por eso el comprobante queda marcado como simulado y lo
   * dice en todas las pantallas donde aparece: un documento que parece
   * autorizado sin estarlo es peor que no tener ninguno.
   */
  emitirSimulado(numero) {
    const c = datos.comprobantes.find((x) => x.numero === numero);
    if (!c) fallo(`No existe el comprobante ${numero}.`);
    if (c.estado !== 'BORRADOR') {
      fallo(`El comprobante ${numero} ya salió de borrador y no se puede volver a emitir. ` +
            'Un comprobante emitido se corrige con una nota de crédito, no editándolo.');
    }
    c.estado = 'AUTORIZADO';
    c.fechaAutorizacion = new Date();
    c.simulado = true;
    persistir();
    return esperar(c);
  },

function conectarMenu() {

    if (ev.target.closest('#boton-menu')) {
      abrir(!marco()?.classList.contains('menu-abierto'));
      return;

    if (ev.target.closest('[data-cerrar-menu]')) { abrir(false); return; }
    // Tocar una opción del menú lo cierra aunque lleve a la pantalla en la que
    // ya se está, que es cuando no hay redibujado que lo cierre solo.
    if (ev.target.closest('.lateral a')) abrir(false);

 * Entrar al pulsar uno de los papeles.
 *
 * Se escucha en el documento y no en cada botón porque las pantallas se
 * redibujan enteras: un escuchador puesto sobre un botón concreto se pierde en
 * el primer redibujado, y el botón deja de responder sin dar ninguna señal.
 */
document.addEventListener('click', (ev) => {
  const boton = ev.target.closest('[data-papel]');
  if (!boton) return;
  sesion.entrar(boton.dataset.papel);
  location.hash = sesion.esSuperAdmin() ? '#/admin/empresas' : '#/empresas';
});


  return { entrar, seleccionEmpresa };
})();

/**
 * Enchufa el botón de emitir.
 *
 * Emitir de verdad son tres pasos —firmar con el certificado, entregar al SRI y
 * preguntar si autorizó— y ninguno de los tres está conectado todavía. Así que
 * el botón avisa de eso antes de hacer nada, y solo sigue si la persona dice
 * que sí. Lo que salga queda marcado como simulado para siempre.
 */
function conectarComprobante() {
  const zona = document.getElementById('raiz');
  if (!zona || conectado) return;
  conectado = true;

  zona.addEventListener('click', async (ev) => {
    const boton = ev.target.closest('#emitir');
    if (!boton) return;

    const seguir = window.confirm([
      'Todavía no está conectada ni la firma electrónica ni el envío al SRI.',
      'Se puede simular el recorrido para verlo funcionando. La factura quedará marcada ' +
      'como SIMULADA en todas las pantallas y no tendrá ninguna validez tributaria.',
      '¿Simular la emisión?',
    ].join('\n\n'));
    if (!seguir) return;

    try {
      await guardar.emitirSimulado(boton.dataset.numero);
      dejarRecado({
        tono: 'ambar', ico: 'science',
        titulo: 'Emisión simulada',
        texto: 'La factura recorrió los estados como lo haría de verdad, pero no se firmó ' +
               'ni se envió a ningún sitio. Queda marcada como simulada.',
      });
      window.dispatchEvent(new CustomEvent('kontia:redibujar'));
    } catch (e) {
      dejarRecado({ tono: 'rojo', ico: 'error', titulo: 'No se pudo emitir', texto: e.message });
      window.dispatchEvent(new CustomEvent('kontia:redibujar'));
    }
  });
}


  return { comprobantes, comprobante, conectarComprobante };

let conectado = false;

/** Un aviso arriba de la pantalla, para los errores y los aciertos. */
function recado(tono, titulo, texto) {
  const sitio = document.getElementById('recado');
  if (!sitio) return;
  sitio.innerHTML = String(aviso({
    tono, ico: tono === 'rojo' ? 'error' : 'check_circle', titulo, texto,
  }));
  sitio.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function conectarEmision() {
  const zona = document.getElementById('raiz');
  if (!zona || conectado) return;
  // Los escuchadores se ponen una sola vez. `raiz` no se reemplaza nunca, solo
  // se le cambia el contenido, así que volver a enchufarlos en cada visita
  // acabaría añadiendo la misma línea tres veces por una sola pulsación.
  conectado = true;

  const repintar = () => {
    const lineas = document.getElementById('lineas');
    const totales = document.getElementById('totales');
    if (lineas) lineas.innerHTML = filasDetalle();
    if (totales) totales.innerHTML = panelTotales();
  };

  zona.addEventListener('input', (ev) => {
    const campo = ev.target.dataset?.campo;
    if (!campo) return;
    const i = Number(ev.target.dataset.linea);
    if (!borrador.lineas[i]) return;
    borrador.lineas[i][campo] = numero(ev.target.value);

    // Se repintan los totales y la celda de esa fila, pero no la tabla entera:
    // redibujarla sacaría el cursor del campo que se está escribiendo.
    const totales = document.getElementById('totales');
    if (totales) totales.innerHTML = panelTotales();
    const celda = ev.target.closest('tr')?.querySelector('td:nth-child(6)');
    if (celda) celda.textContent = dinero(totalLinea(borrador.lineas[i]));
  });

  zona.addEventListener('change', (ev) => {
    const id = ev.target.id;
    if (id === 'cliente') {
      borrador.clienteId = ev.target.value;
      const c = catalogo.clientes.find((x) => x.id === borrador.clienteId);
      if (!c) return;
      document.getElementById('ruc-cliente').textContent = c.identificacion;
      document.getElementById('correo-cliente').textContent = c.correo || '—';
    }
    if (id === 'punto') borrador.punto = ev.target.value;
    if (id === 'forma-pago') borrador.formaPago = ev.target.value;
  });

  zona.addEventListener('click', async (ev) => {
    const quitar = ev.target.closest('[data-quitar]');
    if (quitar) {
      borrador.lineas.splice(Number(quitar.dataset.quitar), 1);
      repintar();
      return;
    }

    if (ev.target.closest('#anadir')) {
      const codigo = document.getElementById('producto')?.value;
      const cantidad = numero(document.getElementById('cantidad-nueva')?.value) || 1;
      const p = catalogo.productos.find((x) => x.codigo === codigo);
      if (!p) return;
      borrador.lineas.push({
        codigo: p.codigo, descripcion: p.descripcion,
        cantidad, precio: p.precio, descuento: 0, iva: p.iva,
      });
      repintar();
      return;
    }

    if (ev.target.closest('#guardar-borrador')) {
      const forma = FORMAS_PAGO.find((f) => f.codigo === borrador.formaPago);
      try {
        const c = await guardar.borrador({
          clienteId: borrador.clienteId,
          punto: borrador.punto,
          formaPago: `${forma.codigo} · ${forma.texto}`,
          lineas: borrador.lineas,
        });
        borrador.lineas = [];   // la siguiente factura empieza en blanco
        location.hash = `#/comprobantes/${c.numero}`;
      } catch (e) {
        recado('rojo', 'No se pudo guardar la factura', e.message);
      }
    }
  });
}


  return { emision, conectarEmision };
})();

function mostrarError(e) {
  const sitio = document.getElementById('recado');
  if (!sitio) return;
  sitio.innerHTML = String(aviso({
    tono: 'rojo', ico: 'error', titulo: 'No se pudo guardar', texto: e.message,
  }));
  sitio.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function conectarFormularios() {
  const zona = document.getElementById('raiz');
  if (!zona || conectado) return;
  conectado = true;

  zona.addEventListener('click', async (ev) => {
    if (ev.target.closest('#guardar-cliente')) {
      const boton = ev.target.closest('#guardar-cliente');
      try {
        const c = await guardar.cliente({
          id: boton.dataset.editando || undefined,
          tipo: valor('tipo'),
          identificacion: valor('identificacion'),
          razonSocial: valor('razonSocial'),
          correo: valor('correo'),
          telefono: valor('telefono'),
          ciudad: valor('ciudad'),
          direccion: valor('direccion'),
        });
        dejarRecado({
          tono: 'info', ico: 'check_circle', titulo: 'Cliente guardado',
          texto: `${c.razonSocial} ya está en su lista y se puede facturar.`,
        });
        location.hash = '#/clientes';
      } catch (e) {
        mostrarError(e);
      }
      return;
    }

    if (ev.target.closest('#guardar-producto')) {
      const boton = ev.target.closest('#guardar-producto');
      try {
        const p = await guardar.producto({
          codigoOriginal: boton.dataset.editando || undefined,
          codigo: valor('codigo'),
          descripcion: valor('descripcion'),
          unidad: valor('unidad'),
          tipo: valor('tipoProducto'),
          precio: valor('precio'),
          iva: valor('iva'),
        });
        dejarRecado({
          tono: 'info', ico: 'check_circle', titulo: 'Producto guardado',
          texto: `${p.descripcion} ya se puede añadir a una factura.`,
        });
        location.hash = '#/productos';
      } catch (e) {
        mostrarError(e);
      }
    }
  });
}


  return { formularioCliente, formularioProducto, conectarFormularios };
})();

const __src_app_js = (function () {
  const { sesion } = __src_sesion_js;
  const { marco, suelta, conectarMenu } = __src_disposicion_js;
  const { entrar, seleccionEmpresa } = __src_vistas_acceso_js;
  const { resumen } = __src_vistas_resumen_js;
  const { comprobantes, comprobante, conectarComprobante } = __src_vistas_comprobantes_js;
  const { emision, conectarEmision } = __src_vistas_emision_js;
  const { clientes, productos } = __src_vistas_catalogo_js;
  const { formularioCliente, formularioProducto, conectarFormularios } = __src_vistas_formularios_js;
  const { configuracion, certificado, usuarios, puntosEmision } = __src_vistas_empresa_js;
  const { adminEmpresas, adminAlta, adminFicha, adminAuditoria } = __src_vistas_admin_js;
  const { pendiente } = __src_vistas_pendiente_js;
  const { aviso, crudo, recogerRecado } = __src_ui_js;

/**
 * El enrutador: mira la dirección del navegador y dibuja la pantalla que toca.
 *
 * Cada pantalla es una función que devuelve HTML. No hay estado compartido
 * entre pantallas ni nada que recordar de una a otra: se entra, se pide el
 * dato, se dibuja. Es la forma más aburrida de hacerlo, y por eso se puede leer
 * entera en una tarde.
 */














/**
 * La tabla de rutas.
 *
 * `admin` marca las pantallas del super administrador. La separación se
 * comprueba abajo, en `resolver`: sin ella, escribir la dirección a mano
 * llevaría al mundo equivocado. Recuerde que la defensa de verdad está en la
 * base de datos, no aquí; esto solo evita que la aplicación se enseñe sola.
 */
const RUTAS = [
  { patron: /^#\/entrar\/?$/, vista: entrar, sinSesion: true },
  { patron: /^#\/empresas\/?$/, vista: seleccionEmpresa, sinMarco: true },

  { patron: /^#\/resumen\/?$/, vista: resumen },
  { patron: /^#\/comprobantes\/?$/, vista: comprobantes },
  { patron: /^#\/comprobantes\/nuevo\/?$/, vista: emision, alDibujar: conectarEmision },
  { patron: /^#\/comprobantes\/([\d-]+)\/?$/, vista: comprobante, alDibujar: conectarComprobante },
  { patron: /^#\/clientes\/?$/, vista: clientes },
  // Las rutas con nombre fijo van ANTES que la que captura cualquier cosa: si
  // `#/clientes/nuevo` cayera en la de abajo, se buscaria un cliente llamado
  // "nuevo" y la pantalla de alta no existiria.
  { patron: /^#\/clientes\/(nuevo)\/?$/, vista: formularioCliente, alDibujar: conectarFormularios },
  { patron: /^#\/clientes\/([^/]+)\/?$/, vista: formularioCliente, alDibujar: conectarFormularios },
  { patron: /^#\/productos\/?$/, vista: productos },
  { patron: /^#\/productos\/(nuevo)\/?$/, vista: formularioProducto, alDibujar: conectarFormularios },
  { patron: /^#\/productos\/([^/]+)\/?$/, vista: formularioProducto, alDibujar: conectarFormularios },
  { patron: /^#\/usuarios\/?$/, vista: usuarios },
  { patron: /^#\/configuracion\/?$/, vista: configuracion },
  { patron: /^#\/certificado\/?$/, vista: certificado },
  { patron: /^#\/puntos-emision\/?$/, vista: puntosEmision },

  { patron: /^#\/admin\/empresas\/?$/, vista: adminEmpresas, admin: true },
  { patron: /^#\/admin\/empresas\/nueva\/?$/, vista: adminAlta, admin: true },
  { patron: /^#\/admin\/empresas\/([\w-]+)\/?$/, vista: adminFicha, admin: true },
  { patron: /^#\/admin\/auditoria\/?$/, vista: adminAuditoria, admin: true },
];

/** Las que todavía no están hechas. Se dicen, no se disimulan. */
const PENDIENTES = {
  '#/retenciones': ['Retenciones', 'receipt',
    'Emitir comprobantes de retención, que es lo que hace un agente de retención cuando ' +
    'paga a un proveedor. El motor ya los genera y los firma; falta la pantalla.'],
  '#/guias': ['Guías de remisión', 'local_shipping',
    'El documento que acompaña a la mercadería mientras viaja. No lleva precios ni ' +
    'impuestos: ampara el traslado, no la venta. El motor ya la genera; falta la pantalla.'],
  '#/notas-credito': ['Notas de crédito', 'assignment_return',
    'Para anular o corregir una factura ya autorizada. Una factura emitida no se borra ' +
    'nunca: se corrige con otro documento que deja constancia. El motor ya las genera.'],
  '#/reportes': ['Reportes contables', 'bar_chart',
    'Libro de ventas, libro de compras y los cuadros que pide el SRI. Esto pertenece a ' +
    'la Fase 2 y no se construye sin un contador que valide las reglas.'],
  '#/consulta': ['Consulta legal-tributaria', 'gavel',
    'El módulo que distingue a Kontia de un proveedor de software: poder preguntarle a ' +
    'un abogado sobre una glosa o un trámite desde dentro del sistema.'],
  '#/admin/suscripciones': ['Suscripciones', 'receipt_long',
    'Planes, cobros mensuales y anuales, y el estado de pago de cada empresa.'],
  '#/admin/uso': ['Uso de la plataforma', 'speed',
    'Cuántos comprobantes emite cada empresa, para dimensionar el servicio y los planes. ' +
    'Cuántos, no cuáles.'],
  '#/admin/soporte': ['Soporte', 'support_agent',
    'Las peticiones de ayuda y los accesos temporales que una empresa autoriza para que ' +
    'usted pueda mirar sus datos durante dos horas.'],
};

const raiz = () => document.getElementById('raiz');

/** Decide qué dibujar, y corrige la dirección cuando no corresponde. */
function resolver(hash) {
  const ruta = hash || '#/entrar';

  if (ruta === '#/salir') { sesion.salir(); return { redirigir: '#/entrar' }; }

  if (!sesion.activa()) {
    return ruta === '#/entrar' ? { ruta, coincide: RUTAS[0], args: [] }
                               : { redirigir: '#/entrar' };
  }

  const esSuper = sesion.esSuperAdmin();
  if (ruta === '#/entrar') return { redirigir: esSuper ? '#/admin/empresas' : '#/resumen' };

  const pendienteAqui = PENDIENTES[ruta];
  if (pendienteAqui) return { ruta, pendiente: pendienteAqui, admin: ruta.startsWith('#/admin') };

  for (const r of RUTAS) {
    const m = ruta.match(r.patron);
    if (!m) continue;
    // Cada quien en su mundo: el super administrador no entra a las pantallas de
    // una empresa, y un usuario de empresa no entra a las de la plataforma.
    if (!!r.admin !== esSuper && !r.sinMarco) {
      return { redirigir: esSuper ? '#/admin/empresas' : '#/resumen' };
    }
    return { ruta, coincide: r, args: m.slice(1) };
  }
  return { ruta, noEncontrada: true, admin: esSuper };
}

async function dibujar() {
  const r = resolver(location.hash);

  if (r.redirigir) { location.hash = r.redirigir; return; }

  let contenido;
  let opciones = { ruta: r.ruta, admin: r.admin ?? sesion.esSuperAdmin() };
  let alDibujar = null;

  if (r.pendiente) {
    const [titulo, ico, texto] = r.pendiente;
    contenido = pendiente({ titulo, ico, texto });
  } else if (r.noEncontrada) {
    contenido = pendiente({
      titulo: 'Esa pantalla no existe', ico: 'help',
      texto: `La dirección ${r.ruta} no corresponde a ninguna pantalla de Kontia.`,
    });
  } else {
    contenido = await r.coincide.vista(...r.args);
    alDibujar = r.coincide.alDibujar ?? null;
    if (r.coincide.sinSesion || r.coincide.sinMarco) {
      raiz().innerHTML = suelta(contenido);
      window.scrollTo(0, 0);
      if (alDibujar) alDibujar();
      return;
    }
  }

  const recado = recogerRecado();
  if (recado) contenido = crudo(String(aviso(recado)) + String(contenido));

  raiz().innerHTML = marco(contenido, opciones);
  // El marco se dibujo de nuevo, asi que el cajon del menu nace cerrado: hay
  // que devolverle al fondo la capacidad de desplazarse.
  document.body.style.overflow = '';
  window.scrollTo(0, 0);
  conectarMenu();
  if (alDibujar) alDibujar();
}

window.addEventListener('hashchange', dibujar);
window.addEventListener('DOMContentLoaded', dibujar);
if (document.readyState !== 'loading') dibujar();

// Permite que las vistas pidan un redibujado sin conocer el enrutador.
window.addEventListener('kontia:redibujar', dibujar);


  return {  };
})();

})();
</script>
