<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontia</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0C3A27; color: rgba(255,255,255,.8); text-align: center;
    font-family: system-ui, -apple-system, sans-serif; padding: 2rem;
  }
  a { color: #8FDCB6; }
</style>
</head>
<body>
<div>
  <p><strong style="color:#fff;font-size:1.15rem">Kontia</strong></p>
  <p style="margin-top:.6rem">Esa direccion cambio. Llevandolo al sitio…</p>
  <p style="margin-top:1.2rem"><a href="./">Entrar a Kontia</a></p>
</div>
<script>
  /*
   * Al sitio, conservando lo que venga detras del #: quien tenia guardado
   * app.html#/resumen aterriza donde queria ir.
   *
   * Se comprueba que no estemos ya en la raiz para no dar vueltas en redondo si
   * algun dia falta el index.html.
   *
   * Y un caso mas: /demo no es un archivo, asi que GitHub Pages tambien sirve
   * esta misma pagina para esa direccion. Se reconoce aqui y se manda con
   * ?demo, que es lo unico que distingue la direccion de demostracion de la
   * real (ver `ajustarSegunDireccion` en app.js).
   */
  (function () {
    var aqui = location.pathname;
    var esDemo = /\/demo\/?$/i.test(aqui);
    if (esDemo || (!/\/$/.test(aqui) && !/index\.html$/.test(aqui))) {
      location.replace('./' + (esDemo ? '?demo' : '') + location.hash);
    }
  })();
</script>
</body>
</html>
